version: 2

models:
  - name: mart_customer_orders
    description: "Customer level order summary with revenue metrics"
    columns:
      - name: customer_id
        description: "Unique customer identifier"
        tests:
          - not_null
          - unique
      - name: total_revenue
        description: "Total revenue generated by customer"
        tests:
          - not_null

  - name: mart_revenue_by_category
    description: "Revenue and profit metrics by product category"
    columns:
      - name: category
        description: "Product category"
        tests:
          - not_null

  - name: mart_daily_sales
    description: "Daily aggregated sales metrics"
    columns:
      - name: order_date
        description: "Date of orders"
        tests:
          - not_null
          - unique