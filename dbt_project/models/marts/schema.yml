version: 2

models:
  - name: mart_customer_orders
    description: "Customer level order summary with revenue metrics"
    meta:
      owner: "data_team"
      tier: "gold"
    columns:
      - name: customer_id
        description: "Unique customer identifier"
        tests:
          - not_null
          - unique

      - name: total_revenue
        description: "Total revenue generated by the customer across all orders"
        tests:
          - not_null

      - name: total_orders
        description: "Total number of orders placed by the customer"
        tests:
          - not_null

  - name: mart_revenue_by_category
    description: "Revenue and profit metrics by product category"
    meta:
      owner: "data_team"
      tier: "gold"
    columns:
      - name: category
        description: "Product category name"
        tests:
          - not_null
          

      - name: total_revenue
        description: "Total revenue generated for this category"
        tests:
          - not_null

      - name: total_profit
        description: "Total profit generated for this category"
        tests:
          - not_null

  - name: mart_daily_sales
    description: "Daily aggregated sales metrics"
    meta:
      owner: "data_team"
      tier: "gold"
    columns:
      - name: order_date
        description: "Date of orders, one row per day"
        tests:
          - not_null
          - unique

      - name: total_orders
        description: "Number of orders placed on this date"
        tests:
          - not_null

      - name: daily_revenue
        description: "Total revenue for the day"
        tests:
          - not_null