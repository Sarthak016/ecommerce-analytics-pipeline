version: 2

models:
  - name: stg_orders
    description: "Cleaned and validated orders data from PySpark ETL"
    columns:
      - name: order_id
        description: "Unique order identifier"
        tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer who placed the order"
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: product_id
        description: "Product ordered"
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id

      - name: status
        description: "Order status"
        tests:
          - accepted_values:
              values: ['completed', 'cancelled', 'pending']

      - name: total_amount
        description: "Total order amount"
        tests:
          - not_null

  - name: stg_customers
    description: "Cleaned and deduplicated customers data"
    columns:
      - name: customer_id
        description: "Unique customer identifier"
        tests:
          - not_null
          - unique

      - name: email
        description: "Customer email address"
        tests:
          - not_null
          - unique

  - name: stg_products
    description: "Cleaned and deduplicated products data"
    columns:
      - name: product_id
        description: "Unique product identifier"
        tests:
          - not_null
          - unique